# Custom health probe for Application Gateway for Containers
# Probes connect directly to backend pod IP addresses on the pod listening port (8080)
apiVersion: alb.networking.azure.io/v1
kind: HealthCheckPolicy
metadata:
  name: backend-v1-health-policy
  namespace: test-infra
spec:
  targetRef:
    group: ""
    kind: Service
    name: backend-v1
    namespace: test-infra
  default:
    interval: 5s
    timeout: 3s
    healthyThreshold: 1
    unhealthyThreshold: 3
    port: 8080
    http:
      host: localhost
      path: /
      match:
        statusCodes:
        - start: 200
          end: 299
    useTLS: false

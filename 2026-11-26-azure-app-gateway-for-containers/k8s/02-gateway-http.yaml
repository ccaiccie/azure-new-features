# Bring-Your-Own (BYO) Gateway API resource referencing the pre-created Azure Frontend
# Replace <AGFC_RESOURCE_ID> and <FRONTEND_NAME> (or apply via envsubst using Terraform/CLI outputs)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-01
  namespace: test-infra
  annotations:
    alb.networking.azure.io/alb-id: "${AGFC_RESOURCE_ID}"
spec:
  gatewayClassName: azure-alb-external
  listeners:
  - name: http-listener
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
  addresses:
  - type: alb.networking.azure.io/alb-frontend
    value: "${FRONTEND_NAME}"
